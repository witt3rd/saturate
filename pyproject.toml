[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saturate"
version = "0.0.1"
description = "Distributed loop execution fabric"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "loop-spec-py @ git+https://github.com/witt3rd/loop-spec.git#subdirectory=python",
]

[project.scripts]
saturate = "saturate.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatchling.build]
include = ["saturate/**"]
